<!doctype html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>H4 Sweep Model-1</title>
<style>
:root{--bg:#0e1116;--c:#171b22;--t:#e6e8eb;--m:#8b93a1;--g:#26a269;--r:#e5484d;--y:#d9a441}
body{margin:0;padding:12px;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;color:var(--m);margin:18px 0 8px;letter-spacing:.06em}
.s{color:var(--m);font-size:12px}.card{background:var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px}.buy{color:var(--g)}.sell{color:var(--r)}
a{color:inherit}.tp{color:var(--g)}.sl{color:var(--r)}.be{color:var(--y)}.n{font-variant-numeric:tabular-nums}
</style></head><body>
<h1>H4 Sweep · M15 CISD / Model-1</h1><div class="s" id="u">...</div>
<h2>FAOL SIGNALLAR</h2><div id="a"></div>
<h2>KUTILAYOTGAN SWEEPLAR</h2><div id="p"></div>
<h2>TARIX</h2><div id="h"></div>
<script>
const TV={"EUR/USD":"EURUSD","GBP/USD":"GBPUSD","XAU/USD":"XAUUSD","XAG/USD":"XAGUSD"};
const f=x=>(+x).toPrecision(6).replace(/\.?0+$/,"");
const link=s=>`<a href="https://www.tradingview.com/chart/?symbol=OANDA:${TV[s]}" target="_blank"><b>${s}</b></a>`;
const card=(s,h)=>`<div class="card"><div class="row"><span>${link(s.sym)} <span class="${s.side}">${s.side.toUpperCase()}</span> <span class="s">${s.mode}</span></span>
<span class="${s.status}">${h?s.status.toUpperCase():"ACTIVE"}</span></div>
<div class="s n">Entry ${f(s.entry)} · SL ${f(s.sl)} · TP ${f(s.tp)}</div><div class="s">${s.t}</div></div>`;
fetch("signals.json?"+Date.now()).then(r=>r.json()).then(d=>{
 u.textContent="Oxirgi o'zgarish: "+(d.updated||"—");
 const act=d.signals.filter(s=>s.status=="active").reverse(),his=d.signals.filter(s=>s.status!="active").reverse();
 a.innerHTML=act.map(s=>card(s)).join("")||'<div class="s">Hozircha yo\'q</div>';
 p.innerHTML=d.pending.slice(-8).reverse().map(x=>`<div class="card"><div class="row"><span>${link(x.sym)} <span class="${x.side}">${x.side.toUpperCase()}</span></span><span class="s n">level ${f(x.level)}</span></div><div class="s">${x.t}</div></div>`).join("")||'<div class="s">Yo\'q</div>';
 h.innerHTML=his.map(s=>card(s,1)).join("")||'<div class="s">Hozircha yo\'q</div>';
});
</script></body></html>
